version: "2"

sql:
  - engine: postgresql
    schema: internal/data/migrations
    queries: internal/data/queries
    gen:
      go:
#        package: "dbstore"
        sql_package: "pgx/v5"
        emit_json_tags: true
        json_tags_case_style: "camel"
#        emit_interface: false
        out: internal/gen/dbstore
        overrides:
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
