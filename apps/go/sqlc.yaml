version: "2"

sql:
  - engine: sqlite
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: "sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        json_tags_case_style: "camel"
        emit_interface: false
        out: internal/db/sqlc
