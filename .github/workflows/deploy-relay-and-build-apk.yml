name: Build Desktop Artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build-desktop:
    name: Build desktop (${{ matrix.build.output }})
    runs-on: ${{ matrix.build.os }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - platform: linux/amd64
            os: ubuntu-latest
            output: linux-amd64
          - platform: windows/amd64
            os: windows-latest
            output: windows-amd64
          - platform: darwin/amd64
            os: macos-13
            output: darwin-amd64
          - platform: darwin/arm64
            os: macos-latest
            output: darwin-arm64
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/go
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/go/go.mod
          cache-dependency-path: apps/go/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Remove local Wails replace directive
        run: go mod edit -dropreplace github.com/wailsapp/wails/v2 || true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          EXTRA_ARGS=()

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            EXTRA_ARGS+=(-tags webkit2_41)
          fi

          wails build \
            -platform "${{ matrix.build.platform }}" \
            -trimpath \
            -ldflags "-X main.Version=${VERSION} -X main.GitCommit=${GITHUB_SHA} -X main.BuildDate=${BUILD_DATE}" \
            "${EXTRA_ARGS[@]}"

      - name: Package desktop artifact
        id: desktop_artifact
        run: |
          mkdir -p dist

          REF_NAME="${{ github.ref_name }}"
          REF_NAME="${REF_NAME//\//-}"
          SHORT_SHA="${GITHUB_SHA::7}"
          ARTIFACT_BASENAME="relaid-desktop-${{ matrix.build.output }}-${REF_NAME}-${SHORT_SHA}"

          case "${{ runner.os }}" in
            Linux)
              ARTIFACT_FILE="${ARTIFACT_BASENAME}.tar.gz"
              tar -C build/bin -czf "dist/${ARTIFACT_FILE}" Relaid
              ;;
            Windows)
              ARTIFACT_FILE="${ARTIFACT_BASENAME}.exe"
              cp build/bin/Relaid.exe "dist/${ARTIFACT_FILE}"
              ;;
            macOS)
              ARTIFACT_FILE="${ARTIFACT_BASENAME}.zip"
              ditto -c -k --sequesterRsrc --keepParent build/bin/Relaid.app "dist/${ARTIFACT_FILE}"
              ;;
          esac

          echo "artifact_name=${ARTIFACT_FILE}" >> "$GITHUB_OUTPUT"
          echo "artifact_path=dist/${ARTIFACT_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.desktop_artifact.outputs.artifact_name }}
          path: apps/go/${{ steps.desktop_artifact.outputs.artifact_path }}
          if-no-files-found: error

  publish-release-assets:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs:
      - build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: relaid-*
          path: release-assets
          merge-multiple: true

      - name: Attach build artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
