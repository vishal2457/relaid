name: Deploy Relay to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - "apps/relay/**"
      - "apps/landing-relaid/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

env:
  RELAY_IMAGE: vishal2457/derived:relay-latest

jobs:
  build-and-push:
    name: Build and push relay image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Relay + Landing
        run: |
          TAG=${GITHUB_SHA::7}

          docker build \
            -f apps/relay/Dockerfile \
            -t vishal2457/derived:relay-$TAG \
            -t "$RELAY_IMAGE" .

          docker push vishal2457/derived:relay-$TAG
          docker push "$RELAY_IMAGE"

  deploy-vps:
    name: Deploy relay on VPS
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    permissions:
      contents: read
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELAY_IMAGE: ${{ env.RELAY_IMAGE }}
          RELAY_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RELAY_ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          RELAY_GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          RELAY_GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          RELAY_GITHUB_RELEASE_TOKEN: ${{ secrets.DOWNLOAD_GH_TOKEN }}
          RELAY_GITHUB_REDIRECT_URI: ${{ secrets.GITHUB_REDIRECT_URI }}
          RELAY_PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          RELAY_APP_DEEP_LINK_SCHEME: ${{ secrets.APP_DEEP_LINK_SCHEME }}
          RELAY_CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          RELAY_SOCKET_REQUEST_TIMEOUT_MS: ${{ secrets.SOCKET_REQUEST_TIMEOUT_MS }}
          RELAY_PAIRING_SESSION_TTL_MS: ${{ secrets.PAIRING_SESSION_TTL_MS }}
          RELAY_LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          envs: RELAY_IMAGE,RELAY_DATABASE_URL,RELAY_ENCRYPTION_KEY,RELAY_GITHUB_CLIENT_ID,RELAY_GITHUB_CLIENT_SECRET,RELAY_GITHUB_RELEASE_TOKEN,RELAY_GITHUB_REDIRECT_URI,RELAY_PUBLIC_BASE_URL,RELAY_APP_DEEP_LINK_SCHEME,RELAY_CORS_ORIGIN,RELAY_SOCKET_REQUEST_TIMEOUT_MS,RELAY_PAIRING_SESSION_TTL_MS,RELAY_LOG_LEVEL
          script: |
            set -euo pipefail

            cd /srv/derived/derived-infra

            echo "Disk before pull:"
            df -h /
            echo "Memory before pull:"
            free -h

            time docker pull "$RELAY_IMAGE"

            docker compose up -d --force-recreate relay nginx

            for i in $(seq 1 12); do
              RELAY_STATUS=$(docker inspect -f '{{.State.Status}}' relaid-relay)
              RELAY_HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' relaid-relay)
              if [ "$RELAY_STATUS" = "running" ] && [ "$RELAY_HEALTH" = "healthy" ]; then
                break
              fi
              sleep 5
            done

            docker compose ps relay nginx

            RELAY_STATUS=$(docker inspect -f '{{.State.Status}}' relaid-relay)
            RELAY_HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' relaid-relay)
            if [ "$RELAY_STATUS" != "running" ] || [ "$RELAY_HEALTH" != "healthy" ]; then
              docker compose logs --tail=200 relay
              echo "Relay container failed readiness checks: status=$RELAY_STATUS health=$RELAY_HEALTH"
              exit 1
            fi

            docker compose logs --tail=80 relay

            docker image prune -f
            echo "Deployment completed successfully!"
