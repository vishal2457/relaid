name: Deploy Relay to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  RELAY_IMAGE: vishal2457/derived:relay-latest

jobs:
  build-and-push:
    name: Build and push relay image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        run: |
          TAG=${GITHUB_SHA::7}

          docker build \
            -f apps/relay/Dockerfile \
            -t vishal2457/derived:relay-$TAG \
            -t "$RELAY_IMAGE" .

          docker push vishal2457/derived:relay-$TAG
          docker push "$RELAY_IMAGE"

  deploy-vps:
    name: Deploy relay on VPS
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    permissions:
      contents: read
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail

            cd /srv/derived/derived-infra
            docker compose pull relay
            docker compose up -d relay nginx
            docker image prune -f
            echo "Deployment completed successfully!"
